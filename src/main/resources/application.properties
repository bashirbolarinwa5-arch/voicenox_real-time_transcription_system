spring.application.name=VOICENOX

# Database Configuration (Reads Render's cloud URL, or falls back to your local laptop port)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/voicenox}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Configuration
server.port=1999

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# External API Keys
deepgram.api.key=${DEEPGRAM_API_KEY}

# JWT Authentication Parameters
application.security.jwt.secret-key=VoiceNoxSuperSecretKeyForJwtAuthenticationSystem2026VoiceNox
application.security.jwt.access-token-expiration=86400000
